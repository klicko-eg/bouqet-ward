.veil{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,248,245,.62) 0%,rgba(255,248,245,.05) 24%,rgba(253,230,234,.0) 46%,rgba(255,248,245,.90) 64%,rgba(255,248,245,.96) 100%)}
.gap{height:clamp(150px,28svh,270px)}
.wrap{max-width:480px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;align-items:center}
.logo {
  width: 132px;
  height: 132px;
}h1{text-shadow:0 0 14px #fff,0 2px 0 #fff;font-family:"Aref Ruqaa",serif;font-weight:700;font-size:2.5rem;line-height:1.2;color:var(--rose);text-shadow:0 2px 0 #fff}
.tag{color:var(--rose2);font-weight:700;font-size:1.02rem;text-align:center;margin-top:-8px;text-shadow:0 1px 0 #fff,0 0 10px #fff}
.orn{display:flex;align-items:center;gap:10px;width:55%}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{transform:scaleX(-1)}
.orn b{width:7px;height:7px;background:var(--rose);transform:rotate(45deg)}
.card{width:100%;background:rgba(255,255,255,.88);border:1px solid rgba(184,138,59,.45);border-radius:22px;padding:14px;box-shadow:0 10px 28px rgba(168,24,60,.12)}
.card h2{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:700;color:var(--rose2);margin-bottom:12px}
.card h2::before,.card h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(184,138,59,.6))}
.card h2::after{transform:scaleX(-1)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 8px;border-radius:15px;border:1px solid rgba(168,24,60,.35);
 font:700 .98rem "Tajawal",sans-serif;color:var(--rose2);text-decoration:none;cursor:pointer;background:#fff;transition:transform .15s,box-shadow .25s}
.btn:active{transform:scale(.97)}
.btn:hover{box-shadow:0 6px 18px rgba(168,24,60,.22)}
.btn svg{width:22px;height:22px;fill:currentColor;flex:none}
.btn.wa{grid-column:1/-1;font-size:1.15rem;padding:18px;color:#fff;border-color:transparent;background:var(--grad);box-shadow:0 10px 26px rgba(168,24,60,.38)}
.btn.wa::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sweep 4s ease-in-out 1.5s infinite}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.two .wa{grid-column:1/-1}
.sm{padding:12px 6px;font-size:.9rem}
.whole{background:linear-gradient(160deg,rgba(255,244,230,.9),rgba(255,255,255,.75));border-color:rgba(184,138,59,.7)}
.whole h2{color:#7a5410}
.whole .btn{border-color:rgba(184,138,59,.6);color:#7a5410}
.whole .btn.wa{background:linear-gradient(135deg,#d6a94f,#b88a3b 60%,#8a6320)}
.whole p{font-size:.82rem;color:#7a5410;text-align:center;margin:-4px 0 10px}
.num{direction:ltr;text-align:center;font-weight:700;letter-spacing:.06em}
.pc{position:relative;display:flex;align-items:center;gap:12px;width:100%;cursor:pointer;color:var(--ink);font-family:"Tajawal",sans-serif;text-align:right;text-decoration:none;
 padding:12px;border-radius:18px;border:1px solid rgba(184,138,59,.55);background:linear-gradient(160deg,#fff,#fff3f5);box-shadow:0 8px 20px rgba(168,24,60,.12);transition:transform .15s,box-shadow .25s}
.pc:active{transform:scale(.97)}.pc:hover{box-shadow:0 10px 26px rgba(168,24,60,.22)}
.pc+.pc{margin-top:10px}
.tile{flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:15px;background:#fff;overflow:hidden;box-shadow:0 0 0 1.5px rgba(184,138,59,.7),0 4px 12px rgba(0,0,0,.12)}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.pt{display:flex;flex-direction:column;gap:3px}.pt b{font-size:1.1rem}.pt small{font-size:.8rem;color:#7a4452;line-height:1.4}
.badge{position:absolute;top:-10px;left:14px;font-style:normal;font-weight:700;font-size:.72rem;color:#fff;background:var(--grad);padding:3px 12px;border-radius:20px}
.socials{display:flex;justify-content:center;gap:26px;width:100%}
.soc{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--rose2);text-decoration:none;font-weight:700;font-size:.9rem}
.soc i{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#fff;color:var(--rose);border:1.5px solid rgba(184,138,59,.7);box-shadow:0 8px 20px rgba(168,24,60,.18);transition:.25s}
.soc svg{width:28px;height:28px;fill:currentColor}
.soc:hover i{background:var(--grad);color:#fff}
footer{font-size:.78rem;color:#8a5a66;text-align:center;line-height:1.7}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(58,15,26,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;max-height:90svh;overflow:auto;transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:21;
 background:linear-gradient(180deg,#fff,#fff3f5);border:1px solid rgba(184,138,59,.6);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));text-align:center;display:flex;flex-direction:column;gap:11px}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{font-size:1.25rem;color:var(--rose)}.sheet p{font-size:.88rem;color:#7a4452;line-height:1.7}
.big{width:72px;height:72px;margin:0 auto}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wg .pc{flex-direction:column;gap:8px;padding:12px 6px;text-align:center}.wg .pc+.pc{margin-top:0}.wg b{font-size:.92rem}
.numbox{direction:ltr;font:700 1.5rem "Tajawal";letter-spacing:.08em;color:var(--rose2);padding:10px;border:1.5px dashed rgba(168,24,60,.5);border-radius:12px;background:#fff}
.steps{text-align:right;font-size:.88rem;line-height:1.9;background:#fff;border:1px solid rgba(184,138,59,.4);border-radius:14px;padding:10px 14px 10px 10px;list-style-position:inside}
.sheet .btn{width:100%}
.btn.fill{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(168,24,60,.35)}
.amt{width:100%;padding:13px;border-radius:13px;border:1.5px solid rgba(168,24,60,.45);font:700 1.1rem "Tajawal";text-align:center;color:var(--rose2);background:#fff;outline:none}
.amt:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(168,24,60,.15)}
.code{direction:ltr;unicode-bidi:isolate;text-align:center;font:600 .85rem monospace;color:#7a4452;word-break:break-all}
.div{display:flex;align-items:center;gap:10px;font-size:.8rem;color:#8a5a66}.div::before,.div::after{content:"";flex:1;height:1px;background:rgba(184,138,59,.5)}
.x{background:none;border:0;color:#8a5a66;font:500 .9rem "Tajawal";padding:6px;cursor:pointer}
.toast{position:fixed;top:max(18px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:var(--grad);color:#fff;font-weight:700;padding:10px 20px;border-radius:30px;z-index:30;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.on{transform:translate(-50%,0)}
.btn:focus-visible,.pc:focus-visible,.soc:focus-visible,.amt:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@keyframes sweep{0%{left:-60%}35%,100%{left:130%}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.wrap>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}.wrap>*:nth-child(2){animation-delay:.1s}.wrap>*:nth-child(3){animation-delay:.18s}.wrap>*:nth-child(4){animation-delay:.26s}.wrap>*:nth-child(5){animation-delay:.34s}.wrap>*:nth-child(6){animation-delay:.42s}.wrap>*:nth-child(7){animation-delay:.5s}.wrap>*:nth-child(8){animation-delay:.58s}}
@media (prefers-reduced-motion:reduce){.btn.wa::after{animation:none}}

/* ورد: compact, soft floral brand styling + responsive polish */
  html{scroll-behavior:smooth}
  body{min-height:100svh;background:radial-gradient(ellipse at 12% 4%,rgba(244,185,198,.22),transparent 34%),radial-gradient(ellipse at 88% 14%,rgba(184,138,59,.12),transparent 28%),var(--cream)}
  .wrap{width:min(100%,480px);padding:clamp(14px,3.8vw,20px) clamp(12px,4vw,20px) calc(18px + env(safe-area-inset-bottom));gap:clamp(10px,2.7vw,14px)}
  .logo{width:clamp(76px,21vw,92px);height:clamp(76px,21vw,92px);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--gold),0 7px 18px rgba(168,24,60,.20)}
  h1{font-size:clamp(2.05rem,9vw,2.5rem);line-height:1.12;letter-spacing:.01em}
  .tag{font-size:.95rem;margin-top:-5px;color:#874056}
  .orn{width:62%;margin-top:1px}
  .gap{height:clamp(18px,5svh,42px)}
  .card{padding:clamp(11px,3.2vw,14px);border-radius:20px;background:rgba(255,255,255,.93);border:1px solid rgba(184,138,59,.34);box-shadow:0 6px 20px rgba(109,27,48,.075)}
  .card h2{margin-bottom:10px;font-size:.96rem;letter-spacing:.01em}
  .row3{gap:8px}.two{gap:8px}
  .btn,.pc{min-height:46px;touch-action:manipulation}
  .btn{border-radius:14px;padding:12px 8px;box-shadow:0 2px 8px rgba(109,27,48,.035)}
  .btn.wa{padding:15px 10px;box-shadow:0 7px 18px rgba(168,24,60,.20)}
  .whole{background:linear-gradient(145deg,rgba(255,247,232,.96),rgba(255,255,255,.95));border-color:rgba(184,138,59,.48)}
  .whole p{margin:0 0 9px;line-height:1.5}
  .pc{padding:10px 11px;border-radius:16px;gap:10px;background:linear-gradient(145deg,#fff,#fff8f8);box-shadow:0 4px 12px rgba(109,27,48,.06);border-color:rgba(184,138,59,.38)}
  .pc+.pc{margin-top:8px}
  .tile{width:52px;height:52px;border-radius:14px;box-shadow:0 0 0 1px rgba(184,138,59,.45)}
  .pt{gap:2px}.pt b{font-size:1.03rem}.pt small{font-size:.78rem;line-height:1.45}
  .socials{gap:20px}
  .soc i{width:58px;height:58px;box-shadow:0 4px 14px rgba(109,27,48,.10)}
  footer{padding-top:2px;color:#946774}
  .sheet{width:min(100%,480px);max-height:calc(100svh - env(safe-area-inset-top) - 8px);padding:17px clamp(14px,4vw,20px) calc(16px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;gap:10px;box-shadow:0 -8px 30px rgba(58,15,26,.10)}
  .sheet .btn{white-space:normal;line-height:1.5}
  .steps{overflow-wrap:anywhere;line-height:1.8;padding:10px 12px}
  @media(max-width:380px){
   .wrap{gap:10px}
   h1{font-size:2.1rem}
   .row3{grid-template-columns:1fr 1fr}
   .row3 .btn:first-child{grid-column:1/-1}
   .btn{font-size:.9rem;padding:11px 6px}
   .btn.wa{font-size:1.02rem;padding:14px 8px}
   .tile{width:48px;height:48px}
   .pt b{font-size:.97rem}
   .socials{gap:14px}
   .soc i{width:54px;height:54px}
  }
  @media(min-width:600px){.gap{height:clamp(26px,5svh,52px)}}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.wrap>*{animation:none!important}.btn.wa::after{animation:none}}
</style>
